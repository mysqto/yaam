# The wire contract of the memory service, as the implementation in `crates/yaam-server` serves it.
#
# Part of the vendorable bundle: an integrator — including a second implementation in another
# language — should be able to work from this file alone, without reading Rust.
#
# `crates/yaam-server/tests/spec_contract.rs` drives the real router and fails if this file and the
# router disagree about a path, a method, a status code, a query parameter, a body field, a header
# name or the sealed-body media type. A spec nobody checks gets believed after it stops being true.
openapi: 3.1.0

info:
  title: yaam memory service
  version: 1.0.0
  summary: Signed HTTP surface over an agent memory store — eight endpoints, no rebuild endpoint.
  license:
    name: MIT
    identifier: MIT
  description: |
    Eight endpoints. Markdown is the source of truth underneath; the index this service reads is
    derived and disposable.

    ## Every request is signed, reads included

    Two headers on every request, on reads as much as on writes:

    | Header | |
    |---|---|
    | `x-yaam-agent` | the agent identity the request is signed as |
    | `x-yaam-signature` | lowercase hex of the tag below, 64 characters |

    The tag is `HMAC-SHA256` over four fields, each of the first three followed by one `\n`:

    ```text
    method    e.g. GET, POST — as it appears on the request line
    target    request target, query string included — e.g. /records?action=deploy&limit=5
    agent     the value of x-yaam-agent
    body      the request bytes, exactly as sent; empty for a GET
    ```

    ```text
    tag = HMAC-SHA256(key, method + "\n" + target + "\n" + agent + "\n" + body)
    ```

    **The query string is inside the signature.** For a read the query *is* the request, so a
    signature over the bare path alone would let one captured read be replayed as any other: strip
    the filters and a narrow read becomes a read of everything the credential can see. Sign the
    target you send, byte for byte — `/records` and `/records?limit=5` are two different requests,
    and so are two spellings of the same filters in a different order.

    The separator is `\n` because no field before the body can contain one — a method and a request
    target come off the HTTP request line, and a header value cannot hold a newline — so no field
    can be stuffed to look like the next.

    Two keys are accepted per agent: the current one and the one most recently rolled away from, so
    a key roll needs no synchronised restart. Tags are compared in constant time, and a malformed
    signature is reported exactly like a wrong one.

    Replay of a byte-identical request is deliberately not defended against here. Writes are
    idempotent on `record_id` and reads mutate nothing, so a replayed message gains an attacker
    nothing the captured response already gave them. Keeping the message secret in flight is the
    transport's job.

    ## A read returns structure, and never a body

    Every read — `GET /records`, `GET /search`, `GET /entities/{kind}/{id}`, `GET /correlate`,
    `GET /bundle` — answers with each matching record's stored frontmatter: identifiers, timestamps,
    agent, action, outcome, declared attributes, entity references, subject pseudonyms, visibility,
    data class and tags. That is a `RecordStructure`, and it is the whole of what a read hands back.

    `GET /correlate` returns two of them per row rather than one, because its answer is a *pair* —
    which record happened near which — and neither half is anything other than the same structure.
    A correlation that answered with the identifiers it joined would be the one read handing back
    two names a caller cannot resolve instead of one.

    `GET /search` is the one read whose *input* is prose, and it is not an exception to any of this:
    the needle goes in and structure comes out. A caller can ask which record mentions a word
    without being handed the words, which is the only shape a full-text read can take here.

    The body is never in it. Not for a sealed record and not for a plaintext one: the rule does not
    branch on `data_class`, because a read that returned prose for `internal` records would be
    returning structure *except sometimes*, and the exception is the thing that leaks. `summary` is
    prose, so it is not a frontmatter key and does not appear. Frontmatter is plaintext already and
    survives in copies key destruction cannot reach, so nothing here is data erasure was meant to
    reach; a body is, which is why reading one is a tree-level operation and not a request.

    Reads answered with bare record identifiers until version 1.0.0 of this document. They no longer
    do, because an identifier was not answerable: the caller had nothing to resolve it with, and the
    only endpoint that opens a record needs the operator role by design.

    ## Reads are scoped per caller, and fail closed

    Visibility is decided from the credential the signature proved, never from the request. There is
    no scope, team or visibility parameter, and adding one to a query is rejected as an unknown
    parameter rather than honoured. A caller sees `org` records, `team` records for the teams its
    credential names, `owner` records only where it is the record's own agent, and `operator`
    records only with the operator role. A read whose entitlements cannot be established returns
    nothing rather than everything.

    ## Status codes carry meaning

    | | |
    |---|---|
    | `200` | read answered; or a write whose identifier was already stored — nothing changed |
    | `201` | write stored, first time this identifier was seen |
    | `202` | write held in quarantine pending subject resolution; re-present it later |
    | `400` | query string not understood — unknown parameter, or one that would not parse |
    | `401` | signature missing, malformed, or wrong |
    | `403` | authenticated, but not permitted this operation |
    | `422` | **permanent.** Fix the record or the request; resending the same bytes cannot help |
    | `500` | this service's own fault. Raise it; do not spin on it |
    | `503` | **transient.** Retry — retrying is safe, because every write is idempotent |

    Every failure answers `{"error": …}` except `400`, which is `text/plain`: the query string is
    rejected before the request reaches a handler, so nothing has built the JSON shape yet. A client
    that parses every error body as JSON breaks on exactly that status.

    `422` against `503` is the pair to get right, and it is the pair clients get backwards. `422`
    says the bytes will never be accepted, so a client that retries burns its queue on a record that
    cannot land. `503` says the record was fine and the service was not, so a client that discards
    it loses audit history exactly when it matters. Neither mistake is visible from the service
    side.

    Retry on `503` freely: a write is keyed by `record_id`, so a redrive after an ambiguous failure
    lands as `200 duplicate` rather than a second record. A replay is answered `200`, never `409` —
    a conflict status would tell a client to stop doing the safe thing.

    ## A sealed body is announced, not sniffed

    `POST /records` accepts either plain JSON or an envelope sealed to the service's public key, and
    the two are told apart by `Content-Type` alone — `application/vnd.yaam.envelope` means sealed.
    Guessing from the first byte is a decision that can be wrong.

    A sealed body that will not open is `503`, not `422`. From here a corrupt envelope and a service
    holding the wrong key are indistinguishable, and a permanent refusal would have every sidecar
    discard good records over an operator's misconfiguration. A wedged spool is visible and
    recoverable; a dropped record is neither.

    ## Unknown query parameters are rejected

    Every query string is parsed against a closed set of names. A mistyped filter that got dropped
    would widen the query to everything and hand the caller a plausible answer to a question it did
    not ask, so `?actionn=deploy` is `400` rather than "all records".

    ## There is deliberately no reindex endpoint

    Rebuilding the index walks the whole tree. It stays a command-line operation (`yaam reindex`),
    and no request can ask for one for its own sake. Do not add a route for it.

    One request does cause a rebuild: `POST /erase`, with the operator role. The index holds a
    wrapped key share per subject and no row can be un-written, so retracting one means rebuilding
    from the erased tree, and the endpoint does it before answering. That is the exception, it is
    expensive, and it is priced into the erasure call rather than offered on its own.

    ## The schemas below have a generated twin

    `spec/schemas/{action-record,envelope,record-structure,result,records,bundle,correlations,links}.v1.json`
    are JSON
    Schema 2020-12 documents
    generated from the implementation's own types, and are the copy to vendor if your tooling reads
    JSON Schema rather than OpenAPI. The schemas *here* are written by hand, and a test compares the
    two: every shape both name has to agree on its fields, its required fields, its enum values and
    its identifier patterns. So this document is checked against the types, not merely against the
    router — but the generated files are the ones that cannot be out of date.

servers:
  - url: /
    description: |
      Deployment-specific. The sidecar is configured with a base URL and posts origin-form targets
      against it; the signed target is the path and query alone, never the absolute form.

security:
  - agentHeader: []
    signatureHeader: []

tags:
  - name: records
    description: Writing and querying action records.
  - name: context
    description: Reads that assemble history for a caller.
  - name: erasure
    description: Destroying a subject's keys. Operator only.

paths:
  /records:
    post:
      tags: [records]
      operationId: writeRecord
      summary: Write one record, attributed to the caller
      description: |
        Idempotent on `record.record_id`: the same identifier written twice stores once and is
        answered `200 duplicate` the second time.

        The caller may only file records under its own agent name. Attribution is the whole value of
        the trail — a caller able to write as another agent can also write the record that explains
        away what it did — so a mismatch is `403` and never reaches the store.

        Bodies are capped at 1 MiB. The signature covers the whole body, so the body must be held in
        memory before anything about it can be trusted; the cap is what stops that being a
        memory-exhaustion lever. Oversize is `422`, because resending the same bytes cannot help.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteRequest'
            examples:
              deploy:
                summary: An internal, org-visible record
                value:
                  record:
                    record_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                    schema_ver: 1
                    at: '2026-08-20T11:04:05Z'
                    received_at: '2026-08-20T11:04:06Z'
                    backfilled: false
                    agent: agent_a
                    agent_ver: 2.1.0
                    correlation_id: c-8f21
                    action: deploy
                    outcome: success
                    attrs:
                      service: api
                      environment: staging
                      build: '412'
                      duration_ms: 48210
                    entities:
                      - kind: deploy
                        id: api/staging#412
                        role: primary
                        confidence: 1.0
                      - kind: ticket
                        id: PROJ-42
                        role: related
                        confidence: 0.7
                    subjects: []
                    visibility: org
                    team: null
                    data_class: internal
                    redaction_policy: default-v1
                    fields_masked: []
                    tags: [rollout]
                    summary: Rolled build 412 out to staging.
                  body: |
                    Rolled build 412 out to staging.

                    Health checks passed on the second probe.
          application/vnd.yaam.envelope:
            schema:
              $ref: '#/components/schemas/SealedEnvelope'
      responses:
        '201':
          description: |
            Stored. First time this identifier was seen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
              example:
                record_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                status: stored
        '200':
          description: |
            Already stored under this identifier; nothing changed. The expected answer to a redrive,
            not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
              example:
                record_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                status: duplicate
        '202':
          description: |
            Accepted into quarantine: a subject named by the record could not be resolved right now,
            so the record is held sealed, unpublished and unindexed rather than rejected. Re-present
            the same bytes later — the retry that succeeds is an ordinary write, and it settles the
            quarantine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
              example:
                record_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                status: quarantined
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The caller may read but not write, or tried to attribute the record to another agent.
            Nothing was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'forbidden: `agent_b` may not attribute a record to `agent_a`'
        '422':
          description: |
            Permanent. The body is not JSON, is larger than 1 MiB, carries a field no schema in it
            declares — at the top level, inside `record`, or inside one of its entity or subject
            references — or the record breaks a contract rule — an empty `action`, a timestamp
            that cannot be read, a `subject_derived` record naming no subject, an `internal` record
            naming one, a `team` visibility with no team, or an entity confidence outside `0.0..=1.0`.
            Do not retry these bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'unprocessable: subject-derived record names no subject'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          description: |
            Transient. The store or the index was briefly unavailable, or the sealed body would not
            open. The record may well be good; retry it. Retrying is safe because the write is keyed
            on `record_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'unavailable: sealed body would not open: authentication failed'
    get:
      tags: [records]
      operationId: queryRecords
      summary: Query records by action, outcome, agent, attribute or time window
      description: |
        Newest first, by the server-stamped time. Narrowed to what the calling credential may see;
        there is no parameter that widens that.

        Unknown parameters are `400`. A window needs both bounds: half a window is a different
        question, not a narrower one, so supplying the missing bound here would answer something the
        caller did not ask.

        Bounded whether or not `limit` says so: an omitted `limit` is the default cap of `200` rows,
        so a short answer is not proof that nothing else matched. Two hundred and not the thousand
        this endpoint defaulted to while it answered with identifiers — a row is now a record's
        frontmatter rather than a 26-byte name, and a thousand of those is most of a megabyte in one
        answer.
      parameters:
        - $ref: '#/components/parameters/action'
        - $ref: '#/components/parameters/outcome'
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/attr'
        - $ref: '#/components/parameters/from_ms'
        - $ref: '#/components/parameters/to_ms'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/Records'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: |
            Permanent. `attr` is not `key=value`, or exactly one window bound was given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'unprocessable: a window needs both `from_ms` and `to_ms`'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /search:
    get:
      tags: [records]
      operationId: searchRecords
      summary: Which records mention something
      description: |
        Full text over record bodies, best match first. The needle reaches the prose and the answer
        does not carry it: each hit comes back as its stored structure, in the same
        `RecordsResponse` as `GET /records`. The question is which record mentions this, and the
        answer is which record — never the words it mentioned it with.

        Only plaintext bodies are searchable. A sealed body holds no text to index, so a
        `subject_derived` record never matches whatever its prose said before it was sealed, and the
        query refuses one explicitly rather than trusting the index to hold nothing. Full text is
        the obvious way around sealing, and this is where that is closed.

        Scoped like every other read, and the scope test is part of the query rather than a filter
        over what it answered: no record outside the caller's scope is ever selected, and there is no
        spelling of `q` that widens what the credential may see.

        **A short page is not proof that nothing else matched.** Neither a row cap nor a scope
        predicate can be pushed into a full-text match, so the matches examined are capped at `20`
        times `limit`, never more than `5000`, taken from the most recently indexed end of what
        matched — and the scope test runs over those. A caller entitled to a small share of what
        matched can get a short page, up to an empty one, while records it may read sit past the
        cap. That is a deliberate loss of recall bought for a bounded read: narrow the needle rather
        than raising `limit` to walk the corpus.

        There is no window, no attribute filter and no ordering parameter here. A full-text read is
        one question; combining it with the filtered query would be a second endpoint pretending to
        be a parameter of this one.
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/Records'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: |
            Permanent. `q` is not an expression the match syntax admits — an unbalanced quote, a
            dangling operator, or an empty needle, which is a search for nothing rather than a
            search for everything. Fix the needle; the same one will never parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: >-
                  unprocessable: full-text needle `unbalanced " quote` is not a match expression:
                  unterminated string
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /entities/{kind}/{id}:
    get:
      tags: [context]
      operationId: entityRecords
      summary: One page of what touches one entity
      description: |
        Entities are the join keys across records. `kind` must be one the deployment configures in
        `spec/entities.yaml`, and `id` is canonicalised by that kind's normalisation steps before it
        is matched — the same steps a write applies, so an identifier good enough to store is good
        enough to find. Asking for `proj-42` where the store holds `PROJ-42` answers the history,
        not an empty list.

        An unconfigured kind, or an identifier the kind's pattern does not admit after
        normalisation, is `422`. It is not an empty result: no rows is indistinguishable from "this
        entity has no history", and a caller cannot tell a bug of its own from a fact about the
        store.

        Scoped to the caller like every other read, and paged like every other read: the answer is
        one page of the entity's history, newest first, capped at `limit` rows. An entity's history
        is as long as that entity is busy, so there is no spelling of this request that returns all
        of it — the busiest identifier in a store would otherwise decide what every reader pays.

        `from_ms` and `to_ms` narrow it to a half-open span of that same server-stamped time. One
        entity inside one window answers *what else touched this ticket while that decline was
        happening*, and it is the reason this is not simply `GET /records` with an entity filter: the
        window is applied inside the query, so the page cap chooses among rows the window already
        selected. A caller narrowing afterwards has it the other way round, and the page silently
        decides which part of the window they see.

        It is not the correlation, though it was the closest thing to one before `GET /correlate`
        existed. This read answers with a window's worth of an entity's history and leaves *which of
        those records happened near which* to whoever read it; a correlation asks that directly, joins
        on time rather than on a shared entity, and returns the pairs. Reach for this one when the
        question is about a thing, and for `GET /correlate` when it is about two events being near each
        other.

        Answers the same `RecordsResponse` as `GET /records`, so both reads hand back structure and
        neither hands back a body. One shape for both, because "what a read returns" is a property of
        this service and not of which read it was.
      parameters:
        - name: kind
          in: path
          required: true
          description: Configured entity kind, e.g. `order_ref`, `ticket`, `deploy`, `chat_user`.
          schema:
            type: string
          example: ticket
        - name: id
          in: path
          required: true
          description: |
            Identifier within the kind, canonicalised here before it is matched. Percent-encode it —
            several configured kinds carry `/`, `#` or `@` inside an identifier — and sign the
            encoded target, since the signature covers the request target exactly as sent.
          schema:
            type: string
          example: PROJ-42
        - $ref: '#/components/parameters/min_confidence'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/from_ms'
        - $ref: '#/components/parameters/to_ms'
      responses:
        '200':
          $ref: '#/components/responses/Records'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: |
            Permanent. `kind` is not configured by this deployment, or `id` is not in that kind's
            canonical form and cannot be normalised into it. Or half a window was supplied: one bound
            asks a different question rather than a narrower one, so it is refused rather than
            completed with a bound the caller did not choose. Fix the request; the same segments will
            never match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'unprocessable: entity id `not a ticket` is not canonical for kind `ticket`'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /correlate:
    get:
      tags: [context]
      operationId: correlateRecords
      summary: Which records of one shape were followed by records of another
      description: |
        The join the cross-agent question reduces to: something failed, and something else happened
        nearby. Two filters in one request — the same names `GET /records` accepts, prefixed by which
        side of the join they constrain — and `within_ms`, which says how long after a `left` record a
        `right` one still counts.

        **Directional.** A pair is returned when the `right` record was stamped at or after the
        `left` one and no later than `within_ms` after it, on the server-stamped clock. So *"which
        declines had a deploy in the half hour after them"* puts the decline on the left, and *"which
        deploys were followed by a decline"* puts the deploy there. There is no backwards window and
        no `within_ms` below zero: the way to ask what came *before* something is to swap the sides,
        and a negative value is `422` rather than the empty page it would otherwise produce.

        **The window is required, and only on the left.** `left.from_ms` and `left.to_ms` bound the
        side the join is driven from; omitting either is `422`. That is stricter than `GET /records`,
        which answers happily with no window at all, and the reason is the plan rather than the
        parameter: this is a non-equi range join, its cost is (rows on the left) × (rows the right
        index has to walk per left row), and the left window is the only thing a request can say that
        bounds the first term. Unwindowed, with the covering index absent or unused, the same
        statement measured 4.2 s over 200,000 records against 1.0 ms with it. Second, an unwindowed
        correlation answers with "the most recent pairs in the store", which moves as records arrive —
        the implicit `recent` this query deliberately does not have, because a question whose meaning
        depends on when it ran cannot be tested.

        There is deliberately no `right.from_ms`. The right side's window *is* the left side's plus
        `within_ms`, computed by the join, so a second one would be a second answer to the same
        question — and a caller that made the two disagree would get an empty page for a reason
        nothing in the request shows.

        `limit` caps the number of **pairs** and carries no prefix, because it is not a page on either
        side. A `right.limit` is `400` rather than accepted and ignored: a page size on the right of a
        join bounds nothing, and a parameter that silently does nothing is worse than one that is not
        there. Absent means the pair cap of `100` — half the row cap the other reads default to,
        because a pair row is two structures.

        A `left` record matching several `right` records is returned once per pair, its frontmatter
        repeated in each. The duplication is the shape of the answer rather than a defect in it: what
        was asked for is which records were near which. Narrow `within_ms` to reduce it.

        Scoped like every other read, and scoped on **both** sides inside the join. A pair joins two
        records whose visibility was decided separately, so a scope test applied to one side only —
        or applied to the pairs after the join — would hand a caller the record on the other side of
        it, which no other read here admits them to.
      parameters:
        - $ref: '#/components/parameters/left_action'
        - $ref: '#/components/parameters/left_outcome'
        - $ref: '#/components/parameters/left_agent'
        - $ref: '#/components/parameters/left_attr'
        - $ref: '#/components/parameters/left_from_ms'
        - $ref: '#/components/parameters/left_to_ms'
        - $ref: '#/components/parameters/right_action'
        - $ref: '#/components/parameters/right_outcome'
        - $ref: '#/components/parameters/right_agent'
        - $ref: '#/components/parameters/right_attr'
        - $ref: '#/components/parameters/within_ms'
        - $ref: '#/components/parameters/correlate_limit'
      responses:
        '200':
          $ref: '#/components/responses/Correlations'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: |
            Permanent. `within_ms` is negative, one or both of `left.from_ms` and `left.to_ms` is
            missing, or `left.attr` / `right.attr` is not `key=value`. Fix the request; the same
            parameters will never answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: >-
                  unprocessable: a correlation needs both `left.from_ms` and `left.to_ms`: the window
                  bounds the side the join is driven from, and there is no implicit `recent`
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /linked/{kind}/{id}:
    get:
      tags: [context]
      operationId: linkedEntities
      summary: What else is connected to one entity, and by which records
      description: |
        The one read whose answer is a graph. Every other read here takes entities the caller can
        already name and answers with records; this one takes one entity and answers with what it is
        connected to, an edge at a time.

        **A link is a record.** Two entities are linked because one record references both — there is
        no edge table, and there is deliberately never going to be one: an edge with no record behind
        it is a claim this system could not rebuild from its own Markdown tree. A second hop is the
        same join taken again from a hop-one neighbour. Every edge carries the record that made it,
        as its stored structure, so *why* two things are connected needs no second read — and a
        follow-up read is where a scope predicate gets forgotten, which at a graph's worth of edges is
        a great many chances to forget it.

        **Scoped at every hop, inside the query.** Each hop joins records whose visibility was decided
        separately. A scope test applied at the seed alone, or to the finished edge list, would tell a
        caller that A and C are connected on the evidence of a record no read admits it to.

        ## The corridor rule

        An entity may be **reached** however busy it is. What it may not do, above `max_degree`
        references inside the window, is carry the traversal onward. Without that rule, the second hop
        of any question passing near a shared identifier answers "everything that identifier ever
        touched" — technically correct and useless.

        The entities the rule refused come back in `hubs`, with the degree that refused them. That
        matters as much as the edges: a short answer otherwise has two causes that call for opposite
        next moves — nothing else is connected, or everything is and this is the node it all runs
        through.

        Degree is counted **inside this request's own window**, unscoped, and no further than one past
        the cap. In-window because the traversal is: an entity that carried the world last month and
        three records during the hour under investigation is exactly the corridor that hour needs, and
        a lifetime count would refuse it. Unscoped because a scoped count cannot be bounded — finding
        `max_degree + 1` *visible* rows means walking the whole history of a hub, which is the work the
        cap exists to avoid — and because a corridor decision that differed per credential would give
        an operator asking "why did this stop here" one answer per caller. The stated cost is a leak of
        one bit: that an entity the caller already reached, through a record it may read, is busy.

        The **seed is not degree-capped**. The caller named it, so asking about a busy identifier
        directly is a legitimate question — it is what `GET /entities/{kind}/{id}` answers — and the
        rule governs passing *through* a node nobody asked for. The cost is that the first hop from a
        hub is as wide as the hub, bounded by the window and the frontier and by nothing else.

        `max_degree` may be **lowered and not raised**. Lowering is how an operator tightens a
        traversal that came back noisy; raising would be a request buying back the problem the rule
        exists to prevent. Above the service cap of `32` it is `422` rather than clamped, because a
        clamped value is one the caller goes on believing.

        ## Confidence, in two tiers

        `min_confidence` is the floor every reference on every hop must clear to be an edge, and it
        defaults to `1.0` — `GET /bundle`'s bar, not `GET /entities/{kind}/{id}`'s `0.0`. The
        difference is who named the far end. An entity read answers about something the caller wrote
        down, so an inferred reference there is one row with its confidence beside it; a traversal
        *invents* the far end, and an inferred link presented as a discovery is indistinguishable from
        a fact for the same reason a guess in a bundle is.

        Lower it and the second tier holds: **an inferred reference may end a path and may not extend
        one.** Walking onward from an entity requires both the reference that discovered it and the
        reference that leaves it to be at full confidence, whatever the floor says. So lowering the
        floor widens what is *reported* and never what is *routed through* — the same shape as the
        corridor rule, applied to the other way a hop can be wrong. Without it, hop two would quietly
        launder what hop one was only willing to show with a confidence attached.

        Each edge reports `confidence`: the weaker of the two references its record makes, so an edge
        is never stronger than the worse half of its own evidence.

        ## What bounds it, and what is refused

        `depth` and the window are both required. A missing `depth` is `400` — there is nothing to
        parse — and a half window is `422`, the same split `GET /correlate` makes for `within_ms`
        against `left.from_ms`. Both are permanent.

        `depth` is `1` to `2`, and the two ends are refused for different reasons. `0` is
        `GET /entities/{kind}/{id}` with more ceremony. `3` is refused because of the frontier below:
        the recursion fills its `200` edges breadth-first, so a third hop is answered out of whatever
        hops one and two left — nothing, over a busy seed — and the answer says nothing about having
        been composed that way. An answer decided by its own bound is not a fact about the store, so
        it is refused rather than given: a limit that refuses is better than one that substitutes a
        different answer. Neither end is clamped, so a caller cannot believe it saw a hop it did not.

        This was `1` to `3` in the version that introduced the endpoint, and depth `3` answered.
        A client that was asking for three hops is not losing an answer it had; it is losing an
        answer composed out of the first two. A per-hop budget is what would restore the third hop,
        and is not expressible as a `LIMIT` on the compound select this read is.

        The window bounds every hop, and it is required for `GET /correlate`'s reason doubled: the
        seed's history is as long as the seed is busy, and a traversal reads a history per node on the
        frontier. There is no implicit `recent`.

        The recursion itself stops at `200` edges, whatever `limit` says — which is also the largest
        page this read serves, so the traversal does as much work as the answer can carry and no
        more. Without it, measured over a 200,000-record store from its busiest identifier at depth
        3, the same request materialises 347 edges over a 30-day window and 35,845 over two years.

        It is a ceiling on recall, and the cost is sharper than the full-text candidate ceiling on
        `GET /search`. The frontier is filled breadth-first, so it is spent on near hops before far
        ones: that 30-day depth-3 traversal comes back with 115 hop-1 edges, 85 hop-2 edges and **no
        hop-3 edges at all** — a request for three hops answered entirely out of the first two. That
        measurement is why `depth` stops at `2` above, and it is recorded here rather than deleted
        with the third hop, because it is also the shape of the second: over a busy enough seed a
        two-hop answer is a page of hop-1 edges and a few hop-2 ones, which is a ceiling on recall
        and not a claim that nothing further is connected. A deep question over a busy seed should
        narrow its window rather than raise its page. A deep question over a quiet one is unaffected,
        because its whole neighbourhood fits.

        `limit` caps **edges**, and absent means `100`. One record making three edges is returned
        three times, its structure repeated, and `token_estimate` counts it each time — because that is
        what returning it three times costs.
      parameters:
        - name: kind
          in: path
          required: true
          description: Configured entity kind of the entity to start from.
          schema:
            type: string
          example: order_ref
        - name: id
          in: path
          required: true
          description: |
            Identifier within the kind, canonicalised here before it is matched, exactly as on
            `GET /entities/{kind}/{id}`. Percent-encode it and sign the encoded target.
          schema:
            type: string
          example: ord10014733
        - $ref: '#/components/parameters/depth'
        - $ref: '#/components/parameters/traverse_from_ms'
        - $ref: '#/components/parameters/traverse_to_ms'
        - $ref: '#/components/parameters/min_confidence_link'
        - $ref: '#/components/parameters/max_degree'
        - $ref: '#/components/parameters/link_limit'
      responses:
        '200':
          $ref: '#/components/responses/Links'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: |
            Permanent. `kind` is not configured by this deployment or `id` cannot be canonicalised;
            or one of `from_ms` and `to_ms` is missing; or `depth` is `0` or above `2`; or
            `max_degree` is above the service cap of `32`, which may be lowered and not raised. Fix
            the request; the same parameters will never answer.

            The two `depth` refusals carry different messages, because a caller can only act on the
            one it hit: `0` is told which endpoint answers it, and anything above `2` is told what
            the answer it asked for would have been made of.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: >-
                  unprocessable: `depth` is 3 and this service traverses 1 to 2 hops: the recursion
                  fills its 200-edge frontier breadth-first, so the frontier is spent on near hops
                  before far ones — measured, a 30-day depth-3 traversal comes back as 115 hop-1
                  edges, 85 hop-2 edges and no hop-3 edges at all. Refused rather than answered out
                  of the first two hops under a third hop's name: ask for 2 and narrow the window
                  rather than raising the page. A per-hop budget is what would lift this, and there
                  is not one yet.
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /bundle:
    get:
      tags: [context]
      operationId: composeBundle
      summary: Compose context for a request
      description: |
        Gathers history for the named entities and actor into one capped, deduplicated set, and
        degrades rather than fails when a source is slow.

        Only references read out of a structured field reach a bundle — inferred ones are excluded
        whatever `min_confidence` a direct entity read would accept, because a guess in a bundle is
        a guess the caller cannot tell apart from a fact.

        Sealed bodies are never opened here, and plaintext ones are not returned either. A caller
        receives each record's structure and no body at all: prose handed to a caller reaches copies
        key destruction cannot erase, and that is as true of an `internal` body as of a sealed one.

        A bundle carries at most 100 records, and at most 50 from any one source, so no single busy
        entity decides the size of a caller's context. Those were 500 and 200 while a bundle carried
        identifiers; 500 records of frontmatter is 300–750 KB, which is not context but a flood.

        Check `degraded` before acting on a bundle. A partial bundle is safe to answer a question
        from and unsafe to act on, and only the caller can make that call — which is why the flag is
        explicit rather than implied by a short result.
      parameters:
        - $ref: '#/components/parameters/entity'
        - $ref: '#/components/parameters/actor'
        - $ref: '#/components/parameters/deadline_ms'
        - $ref: '#/components/parameters/bundle_limit'
      responses:
        '200':
          description: |
            A bundle, possibly incomplete. `200` with `degraded: true` is the normal answer under
            load, not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleResponse'
              example:
                records:
                  - record_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                    schema_ver: 1
                    at: '2026-08-20T11:04:05Z'
                    received_at: '2026-08-20T11:04:06Z'
                    backfilled: false
                    agent: agent_a
                    agent_ver: 2.1.0
                    correlation_id: c-8f21
                    action: deploy
                    outcome: success
                    attrs:
                      service: api
                      environment: staging
                    entities:
                      - kind: ticket
                        id: PROJ-42
                        role: primary
                        confidence: 1.0
                    subjects: []
                    visibility: org
                    team: null
                    data_class: internal
                    redaction_policy: default-v1
                    fields_masked: []
                    tags: [release]
                degraded: true
                omitted: ['entity order_ref:a1b2c3d4: deadline reached']
                token_estimate: 158
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: |
            Permanent. An `entity` term is not `kind:id`, names a kind this deployment does not
            configure, or carries an identifier that kind cannot canonicalise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'unprocessable: `entity` must be `kind:id`, got `ticket`'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /erase:
    post:
      tags: [erasure]
      operationId: eraseSubject
      summary: Destroy a subject's keys
      description: |
        Operator role only, and the role is checked before the body is read: erasure is
        irreversible, so the gate is the first thing the request meets.

        Destroying a subject's keys makes the sealed bodies of every record naming that subject
        permanently unreadable — in this copy and in every other, backups included, because no
        surviving copy holds the key. It does **not** delete records. Frontmatter, attributes, entity
        references and timelines are retained, and the answer says so, so a caller cannot report
        this as having deleted everything about the subject.

        Expensive, and unavoidably so: the derived index holds a wrapped key share per subject and
        no row can be un-written, so the whole index is rebuilt from the erased tree before the
        answer comes back. Budget for that rather than putting this call anywhere a user waits.

        This endpoint takes plain JSON only. The sealed media type is accepted on `POST /records`
        alone; a sealed body sent here is parsed as JSON and fails `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EraseRequest'
            example:
              subject: s_9f2c4b8a1d6e0f37c5a49b2d8e71f036a4c8b5d29e7f13a06c4b8d5e29f7a13c0
      responses:
        '200':
          description: |
            Keys destroyed. Repeating the request for a subject already erased is safe — there are
            no keys left to destroy — but each request writes its own tombstone line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EraseResponse'
              example:
                bodies_sealed_off: 12
                keys_destroyed: 3
                quarantine_settled: 1
                tombstone_id: tomb-01ARZ3NDEKTSV4RRFFQ69G5FC7
                retained: frontmatter, attributes, entity references and timelines are retained
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The caller is not an operator. No key was touched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'forbidden: `agent_a` is not permitted this operation'
        '422':
          description: |
            Permanent. The body is not JSON, carries an undeclared field, or `subject` is not a
            well-formed keyed pseudonym.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'unprocessable: entity id `not-a-pseudonym` is not canonical for kind `subject`'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

components:

  securitySchemes:
    agentHeader:
      type: apiKey
      in: header
      name: x-yaam-agent
      description: |
        The agent identity this request is signed as. A claim, not a grant — it selects which
        credential the signature is checked against, and a write is refused unless the record is
        attributed to this same agent.
    signatureHeader:
      type: apiKey
      in: header
      name: x-yaam-signature
      description: |
        Lowercase hex of `HMAC-SHA256(key, method + "\n" + target + "\n" + agent + "\n" + body)`,
        64 characters. `target` includes the query string. Modelled here as an API key because
        OpenAPI has no scheme for a per-request signature; it is not a bearer token and cannot be
        reused across requests.

  parameters:
    action:
      name: action
      in: query
      required: false
      description: Exact match on one action.
      schema:
        type: string
      example: deploy
    outcome:
      name: outcome
      in: query
      required: false
      description: Spelled as the record serialises it.
      schema:
        $ref: '#/components/schemas/Outcome'
    agent:
      name: agent
      in: query
      required: false
      description: |
        Filters on the record's author, which is not the same as the caller — a credential's own
        scope is applied on top and cannot be widened from here.
      schema:
        type: string
      example: agent_a
    attr:
      name: attr
      in: query
      required: false
      description: |
        One structural attribute, as `key=value`. Compared as text: an integer matches its decimal
        form and a boolean matches `true` or `false`. Sensitive attributes live in the sealed body
        and are not queryable at all.
      schema:
        type: string
        pattern: '^[^=]+=.*$'
      example: environment=staging
    from_ms:
      name: from_ms
      in: query
      required: false
      description: |
        Inclusive start, in milliseconds of the server-stamped time — not the source-reported `at`,
        which may be skewed and is never used for ordering. Requires `to_ms`.
      schema:
        type: integer
        format: int64
      example: 1755676800000
    to_ms:
      name: to_ms
      in: query
      required: false
      description: Exclusive end, on the same clock as `from_ms`. Requires `from_ms`.
      schema:
        type: integer
        format: int64
      example: 1755763200000
    bundle_limit:
      name: limit
      in: query
      required: false
      description: |
        Most records the bundle may return. Absent means the service's own cap of `100`, and a larger
        value is clamped to it rather than refused.

        Distinct from the page size on `GET /records`, and worth setting: this reaches the source
        reads, so a caller asking for five records is charged for five. It is not merely a trim of
        the answer. That distinction was free while a row was a 26-byte identifier and stopped being
        free when a row became the record's structure, at 600 to 1,500 bytes.

        `0` returns no records, as it does elsewhere. A bundle capped below what its sources hold
        reports the difference in `omitted` and sets `degraded`, so a short bundle is never confused
        with a subject that has no history.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
      example: 5

    left_action:
      name: left.action
      in: query
      required: false
      description: |
        Exact match on the action of the earlier record. The `left.` and `right.` prefixes are how one
        request carries two filters: each name is the one `GET /records` accepts, prefixed by the side
        of the join it constrains. Packing a side into one value — `left=action:deploy,outcome=failure`
        — was the alternative and is refused for the reason the parameter set is closed at all: a typo
        inside a packed value cannot be rejected, and a filter that got dropped would widen that side
        of the join to everything.
      schema:
        type: string
      example: transact
    left_outcome:
      name: left.outcome
      in: query
      required: false
      description: Outcome of the earlier record, spelled as the record serialises it.
      schema:
        $ref: '#/components/schemas/Outcome'
    left_agent:
      name: left.agent
      in: query
      required: false
      description: |
        Author of the earlier record. The record's author, not the caller — a credential's own scope
        is applied to both sides on top and cannot be widened from here.
      schema:
        type: string
      example: ledger_bot
    left_attr:
      name: left.attr
      in: query
      required: false
      description: |
        One structural attribute the earlier record must carry, as `key=value`, compared as text
        exactly as `attr` is on `GET /records`.
      schema:
        type: string
        pattern: '^[^=]+=.*$'
      example: provider=gateway_two
    left_from_ms:
      name: left.from_ms
      in: query
      required: true
      description: |
        Inclusive start of the window the earlier record is searched in, in milliseconds of the
        server-stamped time. **Required**, together with `left.to_ms` — unlike every other window on
        this service, which may be omitted entirely. It bounds the side the join is driven from, and
        it is what stops this read costing whatever the store holds; see the endpoint description.

        Its absence is `422`, not `400`: it parses as a window this service will not answer rather
        than as a query string it could not read, which is the same status and the same reason as half
        a window on `GET /records`. `within_ms` is the other required parameter and its absence *is*
        `400`, because there is nothing to parse at all. A client whose retry policy branches on the
        code should read both as permanent.
      schema:
        type: integer
        format: int64
      example: 1755676800000
    left_to_ms:
      name: left.to_ms
      in: query
      required: true
      description: Exclusive end of that window, on the same clock. Required, with `left.from_ms`.
      schema:
        type: integer
        format: int64
      example: 1755763200000
    right_action:
      name: right.action
      in: query
      required: false
      description: |
        Exact match on the action of the later record — the one that has to have happened nearby.
      schema:
        type: string
      example: deploy
    right_outcome:
      name: right.outcome
      in: query
      required: false
      description: Outcome of the later record, spelled as the record serialises it.
      schema:
        $ref: '#/components/schemas/Outcome'
    right_agent:
      name: right.agent
      in: query
      required: false
      description: Author of the later record.
      schema:
        type: string
      example: deploy_bot
    right_attr:
      name: right.attr
      in: query
      required: false
      description: One structural attribute the later record must carry, as `key=value`.
      schema:
        type: string
        pattern: '^[^=]+=.*$'
      example: environment=production
    within_ms:
      name: within_ms
      in: query
      required: true
      description: |
        How long after a `left` record a `right` one still counts, in milliseconds. Required: there is
        no length of time that means "nearby" to every caller, and one this document defaulted would
        answer a question nobody asked. Its absence is `400` — the query string is rejected before a
        handler runs, as for any missing required parameter — while a missing `left.from_ms` is `422`.
        Both are permanent.

        The bound is inclusive at both ends and one-sided in time — `right` at or after `left`, and no
        later than `left + within_ms`. A negative value is `422`, not an empty answer: the join is
        directional, so it describes a window that closes before it opens, and the way to ask about
        what came before something is to swap the two sides.

        Uncapped, and it is the parameter that decides how much of the right index each left row
        walks. There is no principled maximum — a decline and a deploy a week apart is a real question
        — so the cost of a wide one is stated rather than refused.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1800000
    correlate_limit:
      name: limit
      in: query
      required: false
      description: |
        Most **pairs** to return. Absent means the pair cap of `100`.

        Half the `200` rows the other reads default to, because a pair row is two structures: the page
        size here is a byte budget rather than a row count, and a page of pairs at the single-record
        default would be the one answer allowed to be twice the size of every other.

        It caps pairs and not either side's rows, which is why it carries no `left.`/`right.` prefix.
        A `right.limit` is `400` rather than accepted: a page size on the right of a join bounds
        nothing, and a parameter that silently does nothing is worse than one that is absent.
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 20

    depth:
      name: depth
      in: query
      required: true
      description: |
        How many records deep to traverse. `1` is co-mention — entities named by the same record as
        the seed. `2` is co-mention of a co-mention, which is the point of the endpoint: it reaches
        entities the seed's own records never named.

        Required, and 1 to 2. Its absence is `400` — the query string is rejected before a handler
        runs, as for any missing required parameter — while a half window is `422`. Both are
        permanent. `0` and anything above `2` are `422` and not clamped; see the endpoint description.

        `3` is inside the range this endpoint published when it shipped and outside the one it
        enforces now. It was withdrawn rather than deprecated: the frontier is filled breadth-first,
        so what a depth-3 request came back with was hops one and two under a three-hop label, and a
        client cannot tell that from the answer. Ask for `2`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2
      example: 2
    traverse_from_ms:
      name: from_ms
      in: query
      required: true
      description: |
        Inclusive start of the window **every hop** is taken inside, in milliseconds of the
        server-stamped time. Required, together with `to_ms` — unlike the optional window on
        `GET /records` and `GET /entities/{kind}/{id}`, and for `GET /correlate`'s reason doubled: a
        traversal reads a history per node on its frontier. Its absence is `422`.
      schema:
        type: integer
        format: int64
      example: 1755676800000
    traverse_to_ms:
      name: to_ms
      in: query
      required: true
      description: Exclusive end of that window, on the same clock. Required, with `from_ms`.
      schema:
        type: integer
        format: int64
      example: 1755763200000
    min_confidence_link:
      name: min_confidence
      in: query
      required: false
      description: |
        Floor every reference on every hop must clear to be an edge. Defaults to `1.0` — a
        traversal invents the far end, so its default is what a bundle admits rather than what an
        entity read admits.

        Lowering it widens what is reported and never what is routed through: an inferred reference
        may end a path and may not extend one. See the endpoint description.
      schema:
        type: number
        format: float
        minimum: 0
        maximum: 1
      example: 1.0
    max_degree:
      name: max_degree
      in: query
      required: false
      description: |
        Most references an entity may carry inside the window and still be traversed **through**.
        Defaults to `32`, and may be lowered but not raised — above it is `422`.

        The corridor rule, in one number. An entity above it is still reached and reported; it is
        named in `hubs` with the degree that refused it, so the answer says why it stopped rather than
        merely stopping. `32` sits above a busy work item — the node a traversal has to be able to
        walk through — and below a shared context object, where the neighbourhood is the corpus.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 32
      example: 8
    link_limit:
      name: limit
      in: query
      required: false
      description: |
        Most **edges** to return. Absent means `100`.

        The recursion stops at `200` edges whatever this says, so a larger value cannot buy more
        recall; it is a ceiling with the same stated cost as the full-text candidate ceiling on
        `GET /search`. Narrow the window or the depth instead.

        A record that makes three edges is returned three times, its structure repeated, and
        `token_estimate` counts it each time.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 200
      example: 50

    q:
      name: q
      in: query
      required: true
      description: |
        The needle, as an `FTS5` match expression over record bodies: a bare word, several words —
        which match a record holding all of them, anywhere in its body — a prefix as `roll*`, or a
        phrase in double quotes. Required, because a search for nothing is not a search for
        everything, and one this document defaulted would answer a question nobody asked.

        Matched against plaintext bodies only, so it never reaches a sealed one. Whatever it
        matches, it comes back as structure: the needle is the caller's and the answer is the
        record, not the prose.
      schema:
        type: string
        minLength: 1
      example: 'rolled back'

    limit:
      name: limit
      in: query
      required: false
      description: |
        Caps the number of rows returned. Absent means the service's default cap of `200` rows, not
        every match: a page size with no default and no cursor is a trap, and the first caller to
        omit it would read the whole index into memory. A value given here is honoured as given.
        There is no cursor, so page by narrowing the request — a window on `GET /records`, a
        confidence floor on an entity's history, a narrower needle on `GET /search` — rather than by
        walking an offset.

        The default is a property of what a row costs. Each row is a record's frontmatter, 600 to
        1,500 bytes depending on how many attributes, entities and tags it carries, so a page of 200
        is 120–300 KB. A caller that names a large `limit` gets it, and pays for it.
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 50
    min_confidence:
      name: min_confidence
      in: query
      required: false
      description: |
        Tolerance for inferred references. `1.0` keeps only references read out of a structured
        field. Defaults to `0.0` — the endpoint answers "everything about this entity", and a
        default floor would silently drop history the caller cannot tell is missing. Tightening it
        is the caller's decision.
      schema:
        type: number
        format: float
        minimum: 0
        maximum: 1
      example: 1.0
    entity:
      name: entity
      in: query
      required: false
      description: |
        Comma-separated `kind:id` terms. Each contributes its history to the bundle; duplicates
        across terms are one record, counted once. Identifiers are canonicalised as on
        `GET /entities/{kind}/{id}`, and a term that cannot be is `422` rather than a source that
        quietly contributes nothing.
      schema:
        type: string
        pattern: '^[^,]+:[^,]*(,[^,]+:[^,]*)*$'
      example: ticket:PROJ-42,deploy:api/staging#412
    actor:
      name: actor
      in: query
      required: false
      description: Agent whose recent activity is relevant, in addition to the named entities.
      schema:
        type: string
      example: agent_a
    deadline_ms:
      name: deadline_ms
      in: query
      required: false
      description: |
        Budget for the whole composition, default `500`. A source not consulted before the deadline
        names itself in `omitted` and sets `degraded`; it is never silently skipped, because "no
        history" and "never asked" call for opposite decisions.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 250

  responses:
    Records:
      description: |
        Matching records, newest first by the server-stamped time, each as its stored structure.
        Structure and never a body — see "A read returns structure, and never a body" above.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecordsResponse'
          example:
            records:
              - record_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                schema_ver: 1
                at: '2026-08-20T11:04:05Z'
                received_at: '2026-08-20T11:04:06Z'
                backfilled: false
                agent: agent_a
                agent_ver: 2.1.0
                correlation_id: c-8f21
                action: deploy
                outcome: success
                attrs:
                  service: api
                  environment: staging
                entities:
                  - kind: ticket
                    id: PROJ-42
                    role: primary
                    confidence: 1.0
                subjects: []
                visibility: org
                team: null
                data_class: internal
                redaction_policy: default-v1
                fields_masked: []
                tags: [release]
    Correlations:
      description: |
        Matching pairs, the newest `left` record first and — within one `left` record — its `right`
        records in the order they happened. Each half is the record's stored structure, so a
        correlation withholds a body exactly as every other read does.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CorrelationsResponse'
          example:
            pairs:
              - left:
                  record_id: 01ARZ3NDEKTSV4RRFFQ69G5FB2
                  schema_ver: 1
                  at: '2026-08-20T09:15:00Z'
                  received_at: '2026-08-20T09:15:00Z'
                  backfilled: false
                  agent: ledger_bot
                  agent_ver: 1.4.0
                  correlation_id: c-8f21
                  action: transact
                  outcome: declined
                  attrs:
                    provider: gateway_two
                    decline_code: do_not_honour
                  entities:
                    - kind: ticket
                      id: PROJ-42
                      role: primary
                      confidence: 1.0
                  subjects: []
                  visibility: org
                  team: null
                  data_class: internal
                  redaction_policy: default-v1
                  fields_masked: []
                  tags: [transact]
                right:
                  record_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                  schema_ver: 1
                  at: '2026-08-20T09:30:00Z'
                  received_at: '2026-08-20T09:30:00Z'
                  backfilled: false
                  agent: deploy_bot
                  agent_ver: 1.4.0
                  correlation_id: c-8f22
                  action: deploy
                  outcome: failure
                  attrs:
                    service: api
                    environment: production
                  entities:
                    - kind: ticket
                      id: PROJ-42
                      role: primary
                      confidence: 1.0
                  subjects: []
                  visibility: org
                  team: null
                  data_class: internal
                  redaction_policy: default-v1
                  fields_masked: []
                  tags: [deploy]
            token_estimate: 316
    Links:
      description: |
        The graph one entity sits in, as edges and the records behind them, plus the entities the
        corridor rule refused to walk through. Structure and never a body, as on every other read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LinksResponse'
          example:
            edges:
              - from:
                  kind: order_ref
                  id: ord10014733
                to:
                  kind: ticket
                  id: PROJ-42
                hop: 1
                score: 0.5
                confidence: 1.0
                via:
                  record_id: 01ARZ3NDEKTSV4RRFFQ69G5FB2
                  schema_ver: 1
                  at: '2026-08-20T09:15:00Z'
                  received_at: '2026-08-20T09:15:00Z'
                  backfilled: false
                  agent: ledger_bot
                  agent_ver: 1.4.0
                  correlation_id: c-8f21
                  action: transact
                  outcome: declined
                  attrs:
                    provider: gateway_two
                    decline_code: do_not_honour
                  entities:
                    - kind: order_ref
                      id: ord10014733
                      role: primary
                      confidence: 1.0
                    - kind: ticket
                      id: PROJ-42
                      role: primary
                      confidence: 1.0
                  subjects: []
                  visibility: org
                  team: null
                  data_class: internal
                  redaction_policy: default-v1
                  fields_masked: []
                  tags: [transact]
            hubs:
              - kind: chat_channel
                id: ops-room
                degree: 33
            token_estimate: 158
    BadQuery:
      description: |
        The query string was not understood — an unknown parameter, or one that would not parse into
        its type. Rejected rather than ignored, so a mistyped filter fails instead of quietly
        widening the query to everything.

        This one response is `text/plain`, not the JSON error shape: it is produced before the
        request reaches a handler.
      content:
        text/plain:
          schema:
            type: string
          example: 'Failed to deserialize query string: actionn: unknown field `actionn`'
    Unauthenticated:
      description: |
        Signature missing, malformed, or wrong — including a signature valid for a different method,
        target, agent or body. The reason is not narrowed further: telling a prober which part it
        got right is a hint it should not get.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthenticated
    Unavailable:
      description: |
        Transient. Retry. The index may be reopening, a worker may have failed, or a sealed body
        would not open — none of which says the request was bad.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'unavailable: index reopening'
    Internal:
      description: |
        This service's own fault — not the caller's, and not something a client fixes by resending.
        Raise it rather than spinning on it.

        The usual cause is a deployment whose index has not been built, or one whose index has
        drifted from the tree. Both need `yaam reindex`, which is why they are not `503`: no amount
        of patience fixes them.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'index drift on record `01ARZ3NDEKTSV4RRFFQ69G5FAV`'

  schemas:

    RecordId:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: |
        A ULID, and the write's idempotency key. Crockford base32: uppercase, without `I`, `L`, `O`
        or `U`, so a transcription slip cannot turn one valid identifier into another.
      example: 01ARZ3NDEKTSV4RRFFQ69G5FAV

    SubjectHash:
      type: string
      pattern: '^s_[0-9a-f]{64}$'
      description: |
        Keyed pseudonym for an erasable data subject — an HMAC over a canonical subject identifier,
        never a direct identifier, so it is safe in paths, indexes and tombstones. Pseudonymous, not
        anonymous: whoever holds the keying secret can still relink it. Hex is lowercase, because one
        spelling per hash is what lets it serve as both a map key and a path component with no
        normalisation step a caller could forget.
      example: s_9f2c4b8a1d6e0f37c5a49b2d8e71f036a4c8b5d29e7f13a06c4b8d5e29f7a13c0

    Timestamp:
      type: string
      description: |
        RFC 3339. Seconds are mandatory; a fractional part and an offset are optional, and `60`
        seconds is accepted and folded into the same minute. The accepted grammar is contract, not
        an implementation detail: the same text is read by the index and by the tree that derives a
        record's directory from its date, and a stamp only one of them can read files a record under
        a day that queries do not look at.
      example: '2026-08-20T11:04:05Z'

    Outcome:
      type: string
      enum: [success, failure, partial, declined]
      description: |
        `declined` is a refusal by this system or a downstream one — a decision that was taken, as
        against `failure`, where the attempt broke.

    Visibility:
      type: string
      enum: [owner, team, org, operator]
      description: |
        Who may read the record. `owner` is the writing agent alone, and is stored in a per-owner
        subtree whose permissions admit nobody else, so the file system backs the query rather than
        trusting it. `operator` is the audit trail.

    DataClass:
      type: string
      enum: [internal, subject_derived]
      description: |
        Whether the body is erasable. `internal` bodies are plaintext and must name no subject.
        `subject_derived` bodies are sealed under a key derived from *all* the record's subjects, and
        must name at least one — a subject-derived record with no subjects would be sealed under a
        key nobody can destroy, which is unerasable by construction.

    SubjectRole:
      type: string
      enum: [principal, party]
      description: |
        `principal` acted or was acted for; `party` is named by the record without being its
        subject.

    EntityRole:
      type: string
      enum: [primary, context, related]
      description: How central the entity is to the record, not what it is.

    AttrValue:
      description: |
        Deliberately flat — `attrs` is an index surface, not a document store. Nesting a structure
        here would put fields in plaintext frontmatter that no schema declared.
      oneOf:
        - type: string
        - type: integer
        - type: boolean

    EntityRef:
      type: object
      description: |
        A join key. Unknown fields are refused, as everywhere in a write body: a field dropped here
        would leave the record joining on something other than what was sent.
      required: [kind, id, role, confidence]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: |
            A kind the deployment configures in `spec/entities.yaml`. Kinds are configuration, never
            a fixed vocabulary.
          example: ticket
        id:
          type: string
          description: |
            Canonical form for the kind, after that kind's normalisation steps. The service
            canonicalises on write and rejects an identifier the kind's pattern does not admit.
          example: PROJ-42
        role:
          $ref: '#/components/schemas/EntityRole'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            `1.0` means read out of a structured field. Anything lower was inferred from prose, and
            a bundle excludes it entirely. What counts as evidence that prose meant an entity is
            configuration too — `spec/extractors.yaml` — and what it produces stays below `0.9`, so
            an inferred reference is stored and searchable without being joined on by default.
          example: 1.0

    SubjectRef:
      type: object
      description: |
        Unknown fields are refused, as in `EntityRef`.
      required: [hash, role, canon_ver]
      additionalProperties: false
      properties:
        hash:
          $ref: '#/components/schemas/SubjectHash'
        role:
          $ref: '#/components/schemas/SubjectRole'
        canon_ver:
          type: integer
          format: int32
          minimum: 0
          description: |
            Which canonicalisation ruleset produced `hash`. Stamped per subject rather than per
            record, because one re-keyed record can legitimately carry subjects resolved under
            different rulesets; lookups fan out across the live versions.
          example: 1

    ActionRecord:
      type: object
      description: |
        One thing an agent did — the only thing this system stores. The wire record, the Markdown
        frontmatter and the index columns are three projections of it and cannot diverge; `summary`
        is the one exception, being prose that becomes the record body rather than a frontmatter key.

        Unknown fields are refused, at this level and inside `entities` and `subjects` as well as in
        the `WriteRequest` wrapper: a mistyped field that got dropped would store a record the
        caller did not describe and cannot tell is incomplete. `attrs` is the one open map, and is
        checked against `spec/attrs-schema.yaml` instead.
      additionalProperties: false
      required:
        - record_id
        - schema_ver
        - at
        - received_at
        - backfilled
        - agent
        - action
        - outcome
        - attrs
        - entities
        - subjects
        - visibility
        - data_class
        - redaction_policy
        - fields_masked
        - tags
        - summary
      properties:
        record_id:
          $ref: '#/components/schemas/RecordId'
        schema_ver:
          type: integer
          format: int32
          minimum: 0
          description: Which record schema these bytes were written under.
          example: 1
        at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            Source-reported time. May be skewed or replayed, and is never used for ordering or
            windowing.
        received_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            Authoritative for ordering, windowing and the record's place in the tree. Stamped by the
            service unless `backfilled` says otherwise.
        backfilled:
          type: boolean
          description: |
            `true` when `received_at` came from an upstream source rather than this service's clock —
            an import, a replayed spool. It marks the one case where the authoritative timestamp was
            not observed here, so a reader can tell an imported timeline from a live one.
          example: false
        agent:
          type: string
          description: |
            Author. Must equal the `x-yaam-agent` the request was signed as; the service will not
            file history under another agent's name.
          example: agent_a
        agent_ver:
          type: [string, 'null']
          description: |
            Present so a behaviour change can be attributed to a release rather than argued about.
          example: 2.1.0
        correlation_id:
          type: [string, 'null']
          description: Ties every stage of one interaction together across agents.
          example: c-8f21
        action:
          type: string
          minLength: 1
          description: |
            Top-level and indexed, because every useful query filters on it. Must be declared in
            `spec/attrs-schema.yaml` for the deployment to accept the record.
          example: deploy
        outcome:
          $ref: '#/components/schemas/Outcome'
        attrs:
          type: object
          description: |
            Declared, classified attributes. Every key must be declared `structural` for this action
            in `spec/attrs-schema.yaml`; an undeclared or `sensitive` key is refused rather than
            stored, which is what keeps data that key destruction cannot reach out of plaintext
            frontmatter and out of every derived copy.
          additionalProperties:
            $ref: '#/components/schemas/AttrValue'
          example:
            service: api
            environment: staging
        entities:
          type: array
          description: The join keys this record contributes.
          items:
            $ref: '#/components/schemas/EntityRef'
        subjects:
          type: array
          description: |
            Empty for `internal`; at least one entry for `subject_derived`. The body's key is derived
            from all of them together, so no single share decrypts it and changing the set re-seals
            under a fresh key.
          items:
            $ref: '#/components/schemas/SubjectRef'
        visibility:
          $ref: '#/components/schemas/Visibility'
        team:
          type: [string, 'null']
          description: Required when `visibility` is `team`, and meaningless otherwise.
          example: platform
        data_class:
          $ref: '#/components/schemas/DataClass'
        redaction_policy:
          type: string
          description: |
            The policy version applied before the write, e.g. `default-v1` from
            `spec/redaction/default.yaml`. Stored per record so a faulty policy's blast radius is
            one query rather than a guess.
          example: default-v1
        fields_masked:
          type: array
          description: Which fields the policy touched. Informational; nothing keys off it.
          items:
            type: string
        tags:
          type: array
          description: Free-form, unlike `attrs` — not declared, not classified, not query surface.
          items:
            type: string
        summary:
          type: string
          description: |
            Prose, and the fallback for the record body when `body` is absent. Not a frontmatter
            key: it becomes the Markdown document's body, and is sealed along with it when
            `data_class` is `subject_derived`.
          example: Rolled build 412 out to staging.

    RecordStructure:
      type: object
      description: |
        One record as a read returns it: every frontmatter key, and no body. The shape of
        `GET /records`, `GET /search`, `GET /entities/{kind}/{id}` and each entry of a bundle.

        It is `ActionRecord` without `summary`, and that is the whole difference — the key set is the
        Markdown frontmatter's, checked against it in the implementation's own build rather than kept
        in step by hand. There is no field for prose here and no endpoint that adds one: a body is
        read from the Markdown tree, by something with access to the tree.

        `data_class` is worth reading. It says whether the body this answer omits was sealed and
        erasable or plaintext, which is how a caller knows what it is *not* being given.

        Unknown fields are refused, so a `summary` smuggled into a stored projection is an error
        rather than a passenger.
      additionalProperties: false
      required:
        - record_id
        - schema_ver
        - at
        - received_at
        - backfilled
        - agent
        - action
        - outcome
        - attrs
        - entities
        - subjects
        - visibility
        - data_class
        - redaction_policy
        - fields_masked
        - tags
      properties:
        record_id:
          $ref: '#/components/schemas/RecordId'
        schema_ver:
          type: integer
          format: int32
          minimum: 0
          description: Which record schema these bytes were written under.
          example: 1
        at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Source-reported time. May be skewed; never used for ordering.
        received_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Authoritative for ordering, windowing and the record's place in the tree.
        backfilled:
          type: boolean
          description: |
            `true` when `received_at` came from an upstream source rather than this service's clock,
            so a reader can tell an imported timeline from a live one.
          example: false
        agent:
          type: string
          description: The record's author, which is not the caller that read it.
          example: agent_a
        agent_ver:
          type: [string, 'null']
          description: Lets a behaviour change be attributed to a release.
          example: 2.1.0
        correlation_id:
          type: [string, 'null']
          description: |
            Ties every stage of one interaction together across agents. The join a caller reaches for
            when one bundled record is only half the story.
          example: c-8f21
        action:
          type: string
          minLength: 1
          description: What was done.
          example: deploy
        outcome:
          $ref: '#/components/schemas/Outcome'
        attrs:
          type: object
          description: |
            Declared attributes. Structural keys only: a `sensitive` key is refused on write, so it
            is not in frontmatter to be read back here.
          additionalProperties:
            $ref: '#/components/schemas/AttrValue'
          example:
            service: api
            environment: staging
        entities:
          type: array
          description: The join keys this record contributes.
          items:
            $ref: '#/components/schemas/EntityRef'
        subjects:
          type: array
          description: |
            Data subjects named by this record, as keyed pseudonyms — never a direct identifier. Two
            records naming the same pseudonym are about the same subject, which is what a pseudonym
            is for; the identity behind it needs the keying secret, which no caller holds.
          items:
            $ref: '#/components/schemas/SubjectRef'
        visibility:
          $ref: '#/components/schemas/Visibility'
        team:
          type: [string, 'null']
          description: Present when `visibility` is `team`.
          example: platform
        data_class:
          $ref: '#/components/schemas/DataClass'
        redaction_policy:
          type: string
          description: The policy version applied before the write.
          example: default-v1
        fields_masked:
          type: array
          description: Which fields the policy touched. Informational.
          items:
            type: string
        tags:
          type: array
          description: Free-form, unlike `attrs` — not declared, not classified, not query surface.
          items:
            type: string

    WriteRequest:
      type: object
      description: |
        Composed by the sidecar and parsed by the service from one declaration, so the two cannot
        disagree. Unknown fields at this level are refused.
      required: [record]
      additionalProperties: false
      properties:
        record:
          $ref: '#/components/schemas/ActionRecord'
        body:
          type: string
          description: |
            The prose stored as the record body. Absent means `record.summary` is used, which is the
            case where the caller has nothing longer to add.

    SealedEnvelope:
      type: string
      format: binary
      description: |
        A `WriteRequest` JSON document sealed to the service's public key, sent under
        `application/vnd.yaam.envelope` — that media type is the only announcement of sealing, and a
        sealed body sent under any other is parsed as JSON and fails.

        Layout: version byte `1`, a
        32-byte ephemeral X25519 public key, a 12-byte AES-GCM nonce, then AES-256-GCM ciphertext
        and tag. Ephemeral-static X25519 with HKDF-SHA256, one fresh key pair per envelope whose
        private half is dropped as soon as the shared secret is derived — so the sidecar that sealed
        it cannot read it back, on its spool or anywhere else.

    WriteStatus:
      type: string
      enum: [stored, duplicate, quarantined]
      description: Pairs with the status code — `201`, `200`, `202` respectively.

    WriteResponse:
      type: object
      required: [record_id, status]
      properties:
        record_id:
          $ref: '#/components/schemas/RecordId'
        status:
          $ref: '#/components/schemas/WriteStatus'

    RecordsResponse:
      type: object
      description: |
        Structure, and no endpoint here returns a record's body. A query that returned bodies would
        hand out prose to anything that could name a filter, and prose handed to a caller reaches
        copies key destruction cannot erase. A body is read from the Markdown tree, by something with
        access to the tree.

        The answer to `GET /records`, `GET /search` and `GET /entities/{kind}/{id}` alike: what a
        read returns is a property of this service, not of which read was made — including the read
        whose input was prose. `GET /correlate` answers a `CorrelationsResponse` instead, which is the
        same structure two at a time: a pair, because its question is about two records rather than
        one.
      required: [records, token_estimate]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordStructure'
        token_estimate:
          type: integer
          minimum: 0
          description: |
            Rough token cost of this answer, measured over the structures actually returned.
            Advisory, and not a promise about any tokeniser.
        
            Present for the same reason it is on a bundle: these reads hand back the same rows,
            and a caller paging them had no way to size an answer before consuming it.
          example: 158

    CorrelatedPair:
      type: object
      description: |
        One record, and a record that happened inside the window after it. Both as `RecordStructure`,
        because an identifier here would be two names a caller cannot resolve rather than one.

        The order of the two fields is the answer's meaning: `left` is the earlier record and the one
        the question was asked about, `right` is what followed it. A client that read them the other
        way round would report the cause as the consequence.
      required: [left, right]
      properties:
        left:
          allOf:
            - $ref: '#/components/schemas/RecordStructure'
          description: The earlier record — the side `left.*` filtered and `left.from_ms` bounded.
        right:
          allOf:
            - $ref: '#/components/schemas/RecordStructure'
          description: |
            The later record: stamped at or after `left`, and no later than `within_ms` after it.

    CorrelationsResponse:
      type: object
      description: |
        The answer to `GET /correlate`, and the one read answer that is not a list of records.

        Pairs, because which record happened near which is the whole question. Flattened into one
        `records` list it would be a set the caller has to re-join by timestamp — which is the
        arithmetic this endpoint exists to stop somebody doing by hand, and the reason the endpoint
        was added rather than the caller being told to make two reads and intersect them.

        A `left` record matching several `right` records appears once per pair, its structure repeated.
        `token_estimate` counts it each time, because that is what returning it each time costs.
      required: [pairs, token_estimate]
      properties:
        pairs:
          type: array
          description: |
            Newest `left` record first; within one `left` record, its `right` records oldest first.
          items:
            $ref: '#/components/schemas/CorrelatedPair'
        token_estimate:
          type: integer
          minimum: 0
          description: |
            Rough token cost of this answer, measured over both halves of every pair returned.
            Advisory, and not a promise about any tokeniser.
          example: 316

    LinkedEntity:
      type: object
      description: |
        One end of a link. Deliberately not an `EntityRef`: a reference carries a role and a
        confidence because it is one record's claim about one entity, and the ends of a link are not
        claims — the claim is the edge, and it carries its own confidence.
      required: [kind, id]
      properties:
        kind:
          type: string
          example: ticket
        id:
          type: string
          description: Canonical form for the kind.
          example: PROJ-42

    LinkedEdge:
      type: object
      description: |
        Two entities, and the record that names both.

        `from` and `to` are directed by *discovery*, not by causation: `from` is where the traversal
        was standing and `to` is what it reached. A record naming both makes the link symmetric in
        fact, so a client must not read this as "from caused to".
      required: [from, to, hop, score, confidence, via]
      properties:
        from:
          allOf:
            - $ref: '#/components/schemas/LinkedEntity'
          description: Where the traversal was standing — the seed at hop 1, a neighbour beyond that.
        to:
          allOf:
            - $ref: '#/components/schemas/LinkedEntity'
          description: What this edge reaches.
        hop:
          type: integer
          minimum: 1
          maximum: 3
          description: How many records deep this edge sits.
          example: 2
        score:
          type: number
          format: float
          description: |
            What this edge is worth relative to a hop-1 one: `0.5` per hop, so `0.5` at hop 1 and
            `0.25` at hop 2. A pure function of `hop`, published because a client merging these with
            any other signal needs the exchange rate stated rather than invented — one that guessed
            would disagree with every other client.
          example: 0.25
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            The weaker of the two references the record makes, so an edge is never reported as
            stronger than the worse half of its own evidence. Below `1.0` the reference was inferred
            from prose, and this edge ended the path it was on — an inferred reference may not be
            walked through.
          example: 1.0
        via:
          allOf:
            - $ref: '#/components/schemas/RecordStructure'
          description: |
            The record naming both ends. Structure and never a body, as everywhere. It is here rather
            than reachable by a second read because *why* two things are connected is the answer, and
            a second read is where the scope predicate gets forgotten.

    Corridor:
      type: object
      description: |
        An entity the traversal reached and refused to walk through, because it carries more than
        `max_degree` references inside the window.
      required: [kind, id, degree]
      properties:
        kind:
          type: string
          example: chat_channel
        id:
          type: string
          example: ops-room
        degree:
          type: integer
          minimum: 0
          description: |
            References inside the window, counted no further than one past `max_degree` — a floor on
            how busy this entity is, not a census. Counting further would cost exactly what the cap
            exists to avoid paying.
          example: 33

    LinksResponse:
      type: object
      description: |
        The answer to `GET /linked/{kind}/{id}`, and the one read answer that is a graph.

        Edges rather than nodes, because an edge is the unit that carries its own evidence: a node
        list would say what was reached and leave "by what record" to a second read per node. An
        entity reached at two different hops appears on two edges, each with its own record, which is
        two facts rather than a duplicate.
      required: [edges, hubs, token_estimate]
      properties:
        edges:
          type: array
          description: |
            Nearest hop first; within a hop, newest evidence first. Capped at `limit`, and at the
            `200`-edge frontier whatever `limit` says.
          items:
            $ref: '#/components/schemas/LinkedEdge'
        hubs:
          type: array
          description: |
            Entities reached and not traversed through. Named rather than silently dropped, because
            "nothing else is connected" and "everything is, through this node" are the same short
            answer otherwise, and they call for opposite next moves.

            Derived from the edges actually returned, so a page cut short by `limit` may not name
            every corridor refused. Edges arrive nearest-hop first and the nodes whose degree can
            stop a traversal are the near ones, so a truncated page loses far edges before it loses
            a hub. Narrow the window rather than raising the page.
          items:
            $ref: '#/components/schemas/Corridor'
        token_estimate:
          type: integer
          minimum: 0
          description: |
            Rough token cost of this answer, measured over the record on every edge. A record that
            made three edges is counted three times, because that is what returning it three times
            costs. Advisory, and not a promise about any tokeniser.
          example: 158

    BundleResponse:
      type: object
      required: [records, degraded, omitted, token_estimate]
      properties:
        records:
          type: array
          description: |
            Deduplicated across sources and capped, newest-first within each source. Each entry is
            the record's structure, as on every other read.
          items:
            $ref: '#/components/schemas/RecordStructure'
        degraded:
          type: boolean
          description: |
            `true` when a source was not consulted, so the bundle is incomplete. Act on this before
            acting on the contents.
          example: false
        omitted:
          type: array
          description: |
            One line per source that did not contribute, and why. Named rather than silent, because
            a subject with no history and a source that never answered look identical otherwise and
            call for opposite decisions.
          items:
            type: string
        token_estimate:
          type: integer
          minimum: 0
          description: |
            Rough cost of the structure this answer carries: the serialised bytes of `records`,
            divided by four and rounded up. Measured over what is actually being returned — after the
            caps and the de-duplication — so a bundle of two large records costs more than a bundle
            of two small ones, which a per-record constant could not say. Advisory: four bytes per
            token is the conventional rough ratio for compact JSON, and this is not a promise about
            any particular tokeniser.
          example: 158

    EraseRequest:
      type: object
      required: [subject]
      additionalProperties: false
      properties:
        subject:
          $ref: '#/components/schemas/SubjectHash'

    EraseResponse:
      type: object
      required:
        - bodies_sealed_off
        - keys_destroyed
        - quarantine_settled
        - tombstone_id
        - retained
      properties:
        bodies_sealed_off:
          type: integer
          minimum: 0
          description: Records whose bodies became permanently unreadable.
          example: 12
        keys_destroyed:
          type: integer
          minimum: 0
          description: Keys destroyed across all epochs for this subject.
          example: 3
        quarantine_settled:
          type: integer
          minimum: 0
          description: |
            Quarantined records for this subject resolved or discarded as part of the erasure —
            counted here because a record waiting in quarantine would otherwise outlive the key that
            was supposed to erase it.
          example: 1
        tombstone_id:
          type: string
          pattern: '^tomb-[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            `tomb-` followed by a ULID — prefixed, so it cannot be mistaken for the `record_id` it
            sits beside in a log. The line to confirm against in the append-only tombstone log:
            completion is a second line for the same identifier rather than an edit of the first, an
            erasure record that can be rewritten being one that can be unwritten.
          example: tomb-01ARZ3NDEKTSV4RRFFQ69G5FC7
        retained:
          type: string
          description: |
            What key destruction does not reach, restated in every answer so a caller cannot report
            this as having deleted everything about the subject.
          example: frontmatter, attributes, entity references and timelines are retained

    Error:
      type: object
      description: |
        The shape of every failure except `400`, which is produced before a handler runs. The text
        names the failure without naming internals — an unauthenticated caller learns that its
        signature did not verify and nothing more.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          example: 'unprocessable: action is empty'
