[package]
name = "yaam-server"
description = "HTTP service exposing the yaam memory contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
hex.workspace = true
# HMAC-SHA256 over the request, compared in constant time.
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
yaam-contract = { path = "../yaam-contract" }
yaam-core = { path = "../yaam-core" }
# Opening what a sidecar sealed. The same module the sidecar seals with, so there is one envelope
# format rather than one per side.
yaam-crypto = { path = "../yaam-crypto" }
yaam-store = { path = "../yaam-store" }

[dev-dependencies]
tempfile.workspace = true
# Drives the router directly, so handler tests need no listening socket.
tower = { version = "0.5", features = ["util"] }
# The boundary test runs a real sidecar against this router: nothing else proves the two can talk.
yaam-agent = { path = "../yaam-agent" }
