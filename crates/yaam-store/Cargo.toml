[package]
name = "yaam-store"
description = "SQLite index and queries for yaam. Derived, disposable, rebuildable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Lets a caller ask the planner how a read would run. Off by default: it is diagnostic surface for
# benchmarks and operators, and the plan is only trustworthy when it comes from the query's own
# statement text, which is why it lives in this crate rather than in the benchmark.
explain = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
yaam-contract = { path = "../yaam-contract" }
# For `Epoch`: the wrapped share and the epoch that selects its key arrive together, and a
# store-local copy of the epoch type would be a second spelling of the same label.
yaam-crypto = { path = "../yaam-crypto" }

[dev-dependencies]
tempfile.workspace = true
