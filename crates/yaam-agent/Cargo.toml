[package]
name = "yaam-agent"
description = "Local sidecar: seals, spools and signs on a caller's behalf so callers hold no keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
hex.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "io-util", "time", "sync"] }
yaam-contract = { path = "../yaam-contract" }
# Sealing to the service's public key, and the canonical signed message. Both are shared with the
# service rather than spelled out again here.
yaam-crypto = { path = "../yaam-crypto" }
# HTTP without a TLS stack: the payload is already sealed to the service key, so the transport is
# not what protects it.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tempfile.workspace = true
