[package]
name = "yaam-core"
description = "Write pipeline, sweeper, reindex, erasure and bundle composition for yaam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Crash checkpoints are test instrumentation, and a release has no business being able to park a
# write half done. Off by default so the code is absent from a shipped build rather than merely
# unarmed in one; the crash tests are what turn it on. See `crash`.
crash-points = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
hex.workspace = true
saphyr.workspace = true
# Redaction patterns are configuration, so the matcher has to take arbitrary regexes.
regex = "1"
yaam-contract = { path = "../yaam-contract" }
yaam-crypto = { path = "../yaam-crypto" }
yaam-md = { path = "../yaam-md" }
yaam-store = { path = "../yaam-store" }

[dev-dependencies]
tempfile.workspace = true
# Tests assert on the derived rows table by table: "the index is reproducible from the tree" is a
# claim about every table, and only the database itself can be asked whether it holds.
rusqlite = { version = "0.37", features = ["bundled"] }
