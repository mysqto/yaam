[package]
name = "yaam-crypto"
description = "Record sealing and per-subject key management for yaam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
hex.workspace = true
yaam-contract = { path = "../yaam-contract" }
