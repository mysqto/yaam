[package]
name = "yaam-crypto"
description = "Record sealing and per-subject key management for yaam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
hex.workspace = true
yaam-contract = { path = "../yaam-contract" }
aes-gcm = "0.11"
# Sealing a record to the service's public key: X25519 for the key agreement, the same HKDF-SHA256
# and AES-GCM the block format already uses, so there is one set of primitives to review.
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-kw = { version = "0.3", features = ["zeroize"] }
hkdf = "0.13"
# HMAC-SHA256, for the subject pseudonym. The same construction hkdf already uses, exposed directly
# because a pseudonym is a keyed hash of an identifier rather than a derivation of another key.
hmac = "0.13"
# Unicode NFC, for the canonical form a pseudonym is taken over. Without it one character typed as a
# composed code point and as a decomposed pair would be two subjects that nothing can relate again.
unicode-normalization = "0.1"
sha2 = "0.11"
rand = "0.10"
zeroize = "1.9"
subtle = "2.6"
argon2 = "0.6.0-rc.8"

[dev-dependencies]
tempfile = "3"
