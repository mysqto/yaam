[package]
name = "yaam-contract"
description = "Wire types, canonical entity IDs and schema validation for yaam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
saphyr.workspace = true
hex.workspace = true
# Request signing: HMAC-SHA256 over the canonical message, compared in constant time. Here rather
# than in each crate that signs or verifies, so there is one spelling of what gets signed.
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
# Entity patterns are configuration, so the matcher has to take arbitrary regexes.
regex = "1"

[dev-dependencies]
