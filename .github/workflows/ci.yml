name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  hygiene:
    name: hygiene (domain-neutrality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No domain-specific or employer-specific terms
        run: bash ci/hygiene.sh

  test:
    name: fmt · clippy · test · crash · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy, llvm-tools-preview" }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The published schemas, and the three shapes they are generated from. Also a `cargo test`
      # assertion, so a green test run cannot hide it — this is here for the readable failure.
      - run: cargo xtask check
      - run: cargo test --workspace
      # Kills a real service at each durability window and asserts a restarted one converges.
      # Ignored by the run above because it waits minutes on maintenance timers — see ci/check.sh.
      - name: Crash injection (kill -9 at each durability window)
        run: cargo test -p yaam-cli --test crash_injection -- --ignored
      # `yaam-bench` is built by the steps above so it cannot rot, and never run: it has no tests,
      # and its entry point is a `--release` binary that takes minutes. Excluded from coverage
      # because it is measurement code — see ci/check.sh.
      - name: Coverage gate (>= 85% lines)
        run: cargo llvm-cov --workspace --exclude yaam-bench --fail-under-lines 85 --summary-only
