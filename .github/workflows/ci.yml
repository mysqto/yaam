name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  hygiene:
    name: hygiene (domain-neutrality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No domain-specific or employer-specific terms
        run: bash ci/hygiene.sh

  test:
    name: fmt · clippy · test · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy, llvm-tools-preview" }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Coverage gate (>= 85% lines)
        run: cargo llvm-cov --workspace --fail-under-lines 85 --summary-only
